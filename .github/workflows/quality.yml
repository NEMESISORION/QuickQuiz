name: Quality

on:
  push:
    branches:
      - main
      - 'v2-*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, fileinfo, intl, mbstring, openssl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run backend tests
        shell: bash
        run: |
          set +e
          test_output=$(vendor/bin/phpunit 2>&1)
          test_status=$?
          printf '%s\n' "$test_output"

          if [ "$test_status" -ne 0 ]; then
            annotation=${test_output//'%'/'%25'}
            annotation=${annotation//$'\r'/'%0D'}
            annotation=${annotation//$'\n'/'%0A'}
            echo "::error title=PHPUnit failed::$annotation"
          fi

          exit "$test_status"

      - name: Audit PHP dependencies
        run: composer audit --locked

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
