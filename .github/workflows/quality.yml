name: Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'v2-*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, fileinfo, intl, mbstring, openssl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Verify cached application configuration
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan config:clear
          php artisan route:clear

      - name: Verify backend
        shell: bash
        run: |
          set +e
          verification_output=$(composer run verify 2>&1)
          verification_status=$?
          printf '%s\n' "$verification_output"

          if [ "$verification_status" -ne 0 ]; then
            # GitHub truncates command annotations at roughly 4 KB. Keep the
            # tail so the failing assertion is visible instead of only the
            # successful checks that ran before it.
            annotation_output=$(printf '%s\n' "$verification_output" | tail -c 3500)
            annotation=${annotation_output//'%'/'%25'}
            annotation=${annotation//$'\r'/'%0D'}
            annotation=${annotation//$'\n'/'%0A'}
            echo "::error title=Backend verification failed::$annotation"
          fi

          exit "$verification_status"

      - name: Audit PHP dependencies
        run: composer audit --locked

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check
